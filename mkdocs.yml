site_name: SDA
repo_url: https://github.com/FlavienMattern/sda.git

theme:
  name: material

  ### Palette configuration
  palette:

    # Palette toggle for light mode
    - scheme: default
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-night
        name: Dark Mode

    # Palette toggle for dark mode
    - scheme: slate
      primary: indigo
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Light Mode

  ### Font configuration
  font:
    text: Roboto
    code: Roboto Mono

  ### Features configuration
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.path
    - navigation.top
    - navigation.footer
    - toc.follow
    - toc.integrate
    - search.suggest

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_toc_entry: false
            merge_init_into_class: true
            extra:
              show_signature: true
              show_docstring: true

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences

extra_css:
  - styles/style.css

nav:
  - Home: index.md
  - Installation: installation.md
  - sda.core:
      - sda.core.function1: core/function1.md
      - sda.core.inversion: core/inversion.md
  - sda.process:
      - sda.process.download_data: process/download_data.md
      - sda.process.scan_data: process/scan_data.md
      - sda.process.xcorr_noise: process/xcorr_noise.md
      - sda.process.xcorr_noise_postprocessing: process/xcorr_noise_postprocessing.md
      - sda.process.xcorr_noise_monitoring: process/xcorr_noise_monitoring.md