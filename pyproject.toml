[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "sda"
version = "0.0.1"
description = "Tools for seismic data analysis"
authors = [
    { name = "Flavien Mattern" }
]
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "numpy>=2.3.3,<3",
    "scipy>=1.16.1,<2",
    "obspy>=1.5,<2",
    "geopandas>=1.1,<2",
    "pandas>=2.3.3,<3",
    "tqdm>=4.66.2,<5",
    "loky>=3.7,<4",
    "geopy>=2.4.1,<3",
    "h5py>=3.15,<4",
    "matplotlib>=3.10.7,<4",
    "streamlit>=1.50,<2",
    "streamlit-elements>=0.1,<0.2",
    "plotly>=6.2,<7",
    "stqdm>=0.0.5,<1",
    "pydeck>=0.9.1,<1",
    "torch>=2.9,<3",
    "disba>=0.7,<0.8",
    "numba>=0.63,<1",
]

[project.urls]
Homepage = "https://github.com/FlavienMattern/sda"

[project.scripts]
sda = "sda.cli:main"

[tool.setuptools.packages.find]
include = ["sda*"]
